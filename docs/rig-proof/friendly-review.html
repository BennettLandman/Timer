<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>timer. · Friendlier faces</title><style>*{box-sizing:border-box}body{margin:0;background:#f3eee3;color:#244239;font-family:Georgia,serif}main{max-width:1240px;margin:32px auto;padding:24px}h1{font-size:34px;font-weight:normal;margin:0 0 14px}p{font:15px/1.65 system-ui;max-width:800px}.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}figure{margin:0}figcaption{font:14px system-ui;margin-top:12px}.face{aspect-ratio:1;background-size:200% 100%;border-radius:8px;background-color:#e7dfcc}.cat{background-position:0% 0}.fox{background-position:100% 0}.before{background-image:url('friendly-before.png')}.after{background-image:url('friendly-after.png')}a{color:#244239}@media(max-width:700px){main{margin:8px auto;padding:16px}.faces{grid-template-columns:1fr 1fr}}</style><main><h1>A little warmer. A little friendlier.</h1><p>Rounder eyes with softer pupils and highlights, relaxed brows, gentle smiles, and softer ear tips. These stills use the same pose, camera, and lighting for comparison.</p><div class="faces"><figure><div class="face cat before" role="img" aria-label="Cat before, with narrow pupils and a downturned mouth"></div><figcaption>Cat · before</figcaption></figure><figure><div class="face cat after" role="img" aria-label="Updated cat with rounder eyes and a small smile"></div><figcaption>Cat · updated</figcaption></figure><figure><div class="face fox before" role="img" aria-label="Fox before, with small narrow eyes"></div><figcaption>Fox · before</figcaption></figure><figure><div class="face fox after" role="img" aria-label="Updated fox with brighter eyes and a small smile"></div><figcaption>Fox · updated</figcaption></figure></div><p><a href="motion.html?v=friendly-faces">See the updated characters in motion →</a></p></main></html>
