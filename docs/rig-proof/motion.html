<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>timer. · Motion demonstration</title><style>*{box-sizing:border-box}body{margin:0;background:#f3eee3;color:#244239;font-family:Georgia,serif}header,main{max-width:1160px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:36px;letter-spacing:-2px;margin:0}header span{font:11px system-ui;letter-spacing:2px;text-transform:uppercase}.views{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}canvas{width:100%;display:block;border-radius:8px;background:#e7dfcc}#cat{aspect-ratio:1}#fox{aspect-ratio:1.4}figcaption{margin:12px 0;font-size:20px}#small{height:110px;background:#e7dfcc;position:relative;border-radius:8px;overflow:hidden}#small canvas{position:absolute;width:150px;height:100px;bottom:0;left:50%;transform:translateX(-50%)}.hint{font:13px/1.5 system-ui;color:#697268}.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:28px;padding:18px;background:#e8e5d8;border-radius:8px}button,select{border:1px solid #6c7b65;border-radius:24px;padding:10px 18px;background:#f8f5eb;color:#244239;font:14px system-ui;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #cf5c37}label{font:14px system-ui}#seek{flex:1;min-width:180px;accent-color:#3b6351}#phase{font:15px system-ui;min-width:150px}p{font:15px/1.6 system-ui;max-width:760px}@media(max-width:700px){.views{grid-template-columns:1fr}header,main{padding:18px}.controls{gap:10px}}</style><header><h1>timer<span style="color:#cf4e31">.</span></h1><span>Motion demonstration</span></header><main><div class="views"><figure><canvas id="cat" aria-label="Cat reaches and scratches the clock glass"></canvas><figcaption>The cat · <span id="phase">Preparing…</span></figcaption></figure><figure><canvas id="fox" aria-label="Painted fox walking"></canvas><figcaption>The fox · continuous walk</figcaption><div id="small"><canvas id="fox-small" aria-label="Fox at small timer size"></canvas></div><div class="hint">Actual small-size view</div></figure></div><div class="controls"><button id="play">Pause</button><button id="restart">Restart</button><label>Speed <select id="speed"><option value="1">Normal</option><option value=".25">Quarter speed</option></select></label><input id="seek" type="range" min="0" max="6" step=".001" value="0" aria-label="Scrub the six-second motion"><span id="position" class="hint">0.0 s</span></div><p>The approved cat now reaches, touches the glass, scratches, retracts, and shifts its weight. The fox is shown large and at timer size. Use quarter speed or drag the slider to inspect the movement.</p><p class="hint">Motion approval step · <a href="./">Approved appearance still</a></p><p id="error" role="alert"></p></main><script type="module" src="motion.js"></script></html>
